name: Keep PromptML Studio Alive

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up PromptML Studio
        run: |
          curl -s -o /dev/null \
            --max-redirs 10 \
            -w "HTTP Status: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36" \
            https://promptmlstudio.streamlit.app || true
          echo "Ping done"
